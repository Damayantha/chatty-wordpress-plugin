name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  lint:
    name: PHP lint + WordPress Coding Standards
    runs-on: ubuntu-latest
    strategy:
      matrix:
        php-version: ["7.2", "8.3"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP ${{ matrix.php-version }}
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php-version }}
          tools: composer

      - name: PHP syntax check
        run: |
          php -l personaliai-customer-support-chatbot/personaliai-customer-support-chatbot.php
          php -l personaliai-customer-support-chatbot/uninstall.php

      # WPCS only needs to run once (coding-standard checks aren't PHP-version
      # specific) — skip on the older matrix leg to save CI time.
      - name: Install dependencies
        if: matrix.php-version == '8.3'
        run: composer install --no-interaction --prefer-dist

      - name: WordPress Coding Standards
        if: matrix.php-version == '8.3'
        run: vendor/bin/phpcs --standard=WordPress-Extra --extensions=php personaliai-customer-support-chatbot/

  test:
    name: PHPUnit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # PHPUnit itself only needs to run on one PHP version — the plugin's
      # own PHP 7.2 compatibility is already checked above by the lint job's
      # syntax-check matrix leg. PHPUnit 9.6+ (and its own deps: mockery,
      # hamcrest) require PHP >=7.3/7.4, so a 7.2 leg here would fail on the
      # test *tooling's* requirement, not the plugin's.
      - name: Set up PHP 8.3
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.3"
          tools: composer
          extensions: mbstring, dom, filter, json, libxml, tokenizer, xmlwriter

      - name: Install dependencies
        run: composer install --no-interaction --prefer-dist

      - name: Run tests
        run: vendor/bin/phpunit
